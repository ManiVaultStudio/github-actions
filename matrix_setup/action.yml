name: "Matrix prepare"
description: "Supply a matrix GITHUB_OUTPUT"
inputs:
  matrix_ids:
    description: | 
      "A list of matrix ids to be used. Choose from

       - windows_2019 
       - windows_2022 
       - linux_gcc11 
       - linux_gcc13 
       - macos_code15 [arm]
       - macos_code16 [arm]
       
       If empty the default list is used"
    default: 'windows_2022 linux_gcc13 macos_code16'
    required: false

outputs:
  matrix: 
    description: "The centrally defined matrix"
    value: ${{ steps.set-matrix.outputs.matrix }}

runs:
  using: "composite"
  steps:
  - name: Get common matrix  
    uses: actions/checkout@v6
    with:
      repository: ManiVaultStudio/github-actions
      ref: feature/vcpkg_artifactory
      path: matrix
      fetch-depth: 1

  # By providing a list of matrix ids either via an environment variable MATRIX_IDS
  # or via the input, we can select a subset of the matrix files to be used. 
  - name: Get matrix from file  
    run: |
        TARGET_MATRICES="${MATRIX_IDS:-${{ inputs.matrix_ids }}}"
        echo "Using matrix ids: $TARGET_MATRICES"
        if [ -n "$TARGET_MATRICES" ]; then
          all_files=""
          for jfile in "$TARGET_MATRICES"; do all_files+=" matrix/build_matrices/$jfile.json"; done
          echo "matrix is composed of $all_files"
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$(jq -s '[.[][]]' $all_files)" >> $GITHUB_OUTPUT
          echo EOF >> $GITHUB_OUTPUT
        fi
    id: set-matrix 
    shell: bash

  - name: Log matrix
    run: |
      echo "Matrix content"
      echo "${{ steps.set-matrix.outputs.matrix }}"
    shell: bash
