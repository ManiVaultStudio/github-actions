name: "Common cmake steps"
description: "Encapsulate cmake composite run steps that are common for Windows, Linux and Mac"
# reference https://docs.github.com/en/free-pro-team@latest/actions/creating-actions/creating-a-composite-run-steps-action
inputs:
  vcpkg-preset:
    description: "One of the windows preset names definded in CMakePresets.json"
    required: true
  vcpkg-artifactory-url:
    description: "pass secrets.VCPKG_ARTIFACTORY_URL"
    required: true
  vcpkg-artifactory-token:
    description: "pass secrets.VCPKG_ARTIFACTORY_TOKEN"
    required: true

runs:
  using: "composite"
  steps:
      - name: Setup default vcpkg settings
        shell: pwsh
        run: |
          echo "Running setup vcpkg on preset: ${{ inputs.vcpkg-preset }} with os: $env:RUNNER_OS"
          $presetsFile = Join-Path "${{ github.workspace }}" "CMakePresets.json"
          $configFile = Join-Path "${{ github.workspace }}" "vcpkg-configuration.json"
          $defaultPresetsFile = Join-Path "${{ github.action_path }}" "/../vcpkg_setup/CMakePresets.json"
          $defaultConfigFile = Join-Path "${{ github.action_path }}" "/../vcpkg_setup/vcpkg-configuration.json"
          if (-not (Test-Path $presetsFile)) {
            Copy-Item -Path $defaultPresetsFile -Destination "${{ github.workspace }}"
          }
          if (-not (Test-Path $$configFile)) {
            Copy-Item -Path $defaultConfigFile -Destination "${{ github.workspace }}"
          }
          
      - name: Clone vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          path: .vcpkg
          fetch-depth: 0

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13' 

      - name: Enable Windows Long Paths
        if: runner.os == 'Windows'
        run: New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Bootstrap vcpkg and python
        shell: pwsh
        run: | 
          $vcpkgRoot = Join-Path "${{ github.workspace }}" ".vcpkg"
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          if ($env:RUNNER_OS -eq "Windows") {
            & "${{ github.workspace }}\.vcpkg\bootstrap-vcpkg.bat" -disableMetrics
            $python = Join-Path $env:pythonLocation "python.exe"
          } else {
            & "${{ github.workspace }}\.vcpkg\bootstrap-vcpkg.sh" -disableMetrics
            $python = Join-Path $env:pythonLocation "bin" "python3"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON3_EXECUTABLE=$python"
          echo ${{ github.workspace }}\.vcpkg\ >> $GITHUB_PATH
          echo "VCPKG_FEATURE_FLAGS=registries" >> $env:GITHUB_ENV
# $config_path = Join-Path ${{ github.workspace }} test registry-tester vcpkg-configuration.json
# echo "VCPKG_CONFIG_FILE=$config-path" >> $env:GITHUB_ENV
# $test_workdir = Join-Path ${{ github.workspace }} test registry-tester
# Add-Content -Path $env:GITHUB_ENV -Value "TEST_WORKDIR=$test_workdir"

      - name: Install required Python packages
        shell: pwsh
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests packaging colorama

      - name: Install Linux build dependencies and add pem chain to cert store
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
          sudo cp ${{ github.action_path }}/../lkebartifactory.nl.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates 

      # Process mv_deps.toml if present to produce 
      # an overlay for the ManiVault dependencies
      - name: Create overlay from mv_deps.toml
        shell: pwsh
        run: |
          if (Test-Path -path ./mv_deps.toml) {
            $toolchainFile = Join-Path "${{ github.action_path }}" "/../CMakeSupport/gha_vcpkg_toolchain.cmake"
            python3 ${{ github.action_path }}/../python/create_overlay.py --toolchain $toolchainFile
          } else {
            New-Item -Name "ports" -Type Directory
          }
      #      ls -R ./ports
      #      ls -R ./external
      #    }

      # TODO inject the dependencies from mv_deps.toml into the vcpkg.json manifest
      # The vcpkg.json may have to be created if there are no other dependencies

      # vcpkg automatically resolves ports under ./ports based on vcpkg-configuration.json
      #- name: Run vcpkg install
      #  shell: pwsh
      #  env:
      #    VCPKG_KEEP_ENV_VARS: "PYTHON3_EXECUTABLE;SEVEN_ZIP_EXECUTABLE"
      #    VCPKG_BINARY_SOURCES: "clear;http,${{ inputs.vcpkg-artifactory-url }}/{name}/{version}/{triplet}/{sha},readwrite,Authorization: Bearer ${{ inputs.vcpkg-artifactory-token }}" 
      #    VCPKG_FEATURE_FLAGS: "versions,registries"
      #  run: |
      #    $portsDir = Join-Path "${{ github.workspace }}" "ports"
      #    vcpkg --debug install --overlay-ports=$portsDir         

      - name: Install build dependencies (Linux)
        shell: bash
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxi-dev libxrender-dev libxfixes-dev \
            libxcb1-dev libx11-xcb-dev libxcb-glx0-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libxrandr-dev libxxf86vm-dev autoconf automake libtool pkg-config

      - name: Install libomp for macos
        shell: bash
        if: runner.os == 'macOS'
        run: brew install libomp

      #    $sevenZip = (Get-Command 7z).Source
      #    echo "7z at $sevenZip"
      #    $env:SEVEN_ZIP_EXECUTABLE = $sevenZip
      - name: Configure project   # this drives the port build
        shell: pwsh
        env:
          VCPKG_KEEP_ENV_VARS: "PYTHON3_EXECUTABLE;SEVEN_ZIP_EXECUTABLE"
          VCPKG_BINARY_SOURCES: "clear;http,${{ inputs.vcpkg-artifactory-url }}/{name}/{version}/{triplet}/{sha},readwrite,Authorization: Bearer ${{ inputs.vcpkg-artifactory-token }}" 
          VCPKG_FEATURE_FLAGS: "versions,registries"
        run: |
          $buildDir = Join-Path "${{ github.workspace }}" "build"
          $installDir = Join-Path $buildDir "install"
          echo "Processing $env:GITHUB_REPOSITORY"
          if ($env:GITHUB_REPOSITORY -ne "ManiVaultStudio/core") {
            $toolchainFile = Join-Path "${{ github.action_path }}" "/../CMakeSupport/gha_vcpkg_toolchain.cmake"
            $projectInclude = "-DCMAKE_PROJECT_INCLUDE=$toolchainFile"
          } else {
            $projectInclude = ""
          }
          cmake --preset ${{ inputs.vcpkg-preset }} -S . -B $buildDir "-DMV_INSTALL_DIR=$installDir" -DCMAKE_BUILD_TYPE=Release "$projectInclude"
   
      - name: Upload vcpkg install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-manifest-install-log
          path: | 
            D:/a/core/core/build/vcpkg-manifest-install.log


# Set-Location "$env:TEST_WORKDIR"
      - name: Build project
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;http,${{ inputs.vcpkg-artifactory-url }}/{name}/{version}/{triplet}/{sha},readwrite,Authorization: Bearer ${{ inputs.vcpkg-artifactory-token }}" 
          VCPKG_FEATURE_FLAGS: "versions,registries"
        run: | 
          cmake --build .\build --config Release

      - name: Upload raw log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-logs
          path: build_log.txt